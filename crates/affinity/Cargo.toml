[package]
name = "photocraft-affinity"
description = "Bounded reader for native Affinity documents: archive, object stream and document model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Reference Zstandard decoder; pure Rust remains the default.
native-zstd = ["dep:zstd"]
# Synthetic-container builders for tests and fuzz seeds; not an Affinity exporter.
synth = []

[dependencies]
crc32fast = "1.5"
flate2 = { workspace = true }
ruzstd = "0.9.1"
zstd = { version = "0.13.3", default-features = false, optional = true }

[dev-dependencies]
proptest = { workspace = true }
