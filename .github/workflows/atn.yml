name: ATN

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds of ATN parser fuzzing"
        type: choice
        options: ["60", "300", "600"]
        default: "60"

permissions:
  contents: read

concurrency:
  group: atn-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Keep optimized arithmetic behavior without paying for release LTO in a parser test job.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  parser:
    name: ATN parser (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # These small CPU-only jobs can share the macOS pool with release builds.
      max-parallel: 3
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: X64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: ARM64 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, arch: X64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: ARM64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, arch: X64 }
          - { os: macos-15, target: aarch64-apple-darwin, arch: ARM64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: atn-parser-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Record native execution environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          TEST_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p atn-results
          # A successful cross-compilation must never stand in for native execution.
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          {
            git rev-parse HEAD
            printf 'runner=%s arch=%s target=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$TEST_TARGET"
            printf 'image=%s version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            rustc -vV
            cargo -V
          } | tee atn-results/environment.txt
      - name: Parser unit tests
        env:
          TEST_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo test --locked -p photocraft-psd --target "$TEST_TARGET" --lib atn::tests:: -- --nocapture 2>&1 | tee atn-results/unit.log
      - name: Parser contract tests (debug)
        env:
          TEST_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo test --locked -p photocraft-psd --target "$TEST_TARGET" --test atn_contract -- --nocapture 2>&1 | tee atn-results/debug.log
      - name: Parser contract tests (release)
        env:
          TEST_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo test --locked --release -p photocraft-psd --target "$TEST_TARGET" --test atn_contract -- --nocapture 2>&1 | tee atn-results/release.log
      - name: Upload parser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atn-parser-${{ matrix.target }}
          path: atn-results/
          if-no-files-found: error
          retention-days: 14

  parser-gate:
    name: ATN parser gate
    needs: parser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native parser leg
        env:
          PARSER_RESULT: ${{ needs.parser.result }}
        run: test "$PARSER_RESULT" = success

  fuzz:
    name: ATN parser fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: atn-fuzz
          workspaces: crates/psd/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed parser fuzzing with the contract fixtures
        run: |
          mkdir -p crates/psd/fuzz/corpus/atn atn-results
          cp crates/psd/tests/fixtures/atn/*.atn crates/psd/fuzz/corpus/atn/
          {
            git rev-parse HEAD
            rustc -vV
            cargo fuzz --version
            sha256sum crates/psd/tests/fixtures/atn/*.atn
          } | tee atn-results/fuzz-environment.txt
      - name: Fuzz ATN parsing and writing
        working-directory: crates/psd
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '60' }}
        run: |
          set -o pipefail
          cargo fuzz run atn -- -max_total_time="$FUZZ_SECONDS" -max_len=65536 -rss_limit_mb=512 -timeout=5 2>&1 | tee ../../atn-results/fuzz.log
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atn-fuzz-evidence
          path: |
            atn-results/
            crates/psd/fuzz/artifacts/atn/
            crates/psd/fuzz/corpus/atn/
          if-no-files-found: warn
          retention-days: 14
