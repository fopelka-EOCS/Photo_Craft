name: Adapter v2 draft schema review (not wire conformance)

on:
  push:
    branches: [main, "compat/**"]
    paths:
      - "docs/spec-adapter-v2/**"
      - ".github/workflows/adapter-spec.yml"
  pull_request:
    paths:
      - "docs/spec-adapter-v2/**"
      - ".github/workflows/adapter-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-review:
    name: Draft schemas and synthetic JSON examples only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CI schema validator dependencies
        run: python -m pip install --disable-pip-version-check -r docs/spec-adapter-v2/requirements-ci.txt
      - name: Validate draft schemas and positive and negative JSON examples
        run: python docs/spec-adapter-v2/validate.py --schema
      - name: Scope of this check
        run: |
          echo 'Draft schema checks only. No implemented v2 codecs, binary golden vectors, independent client interoperability, model artifact or NPU execution is certified.' >> "$GITHUB_STEP_SUMMARY"
